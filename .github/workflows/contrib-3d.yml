name: GitHub-Profile-3D-Contrib

on:
  # Runs automatically once a day (00:00 UTC)
  schedule:
    - cron: "0 0 * * *"
  # Lets you run it manually from the Actions tab
  workflow_dispatch:
  # Runs once automatically when this workflow file is added or edited (first run)
  push:
    paths:
      - ".github/workflows/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    steps:
      - uses: actions/checkout@v5

      # Reads your contribution calendar and draws it as 3D SVG images
      - uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      # Saves the generated images into the profile-3d-contrib/ folder of your repo
      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A .
          if git commit -m "generated"; then
            git push
          fi
