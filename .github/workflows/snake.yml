name: Generate Contribution Snake

on:
  # Rebuild every day at 00:00 UTC
  schedule:
    - cron: "0 0 * * *"
  # Lets you run it manually from the Actions tab (do this once after adding the file)
  workflow_dispatch:
  # Rebuild whenever the workflow or README changes
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Turns your contribution graph into a snake animation (SVG)
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=00A3AD&color_dots=#ebedf0,#b6ecf0,#7dd8e0,#3cbfcb,#00a3ad
            dist/github-snake-dark.svg?color_snake=5AD7FF&color_dots=#161b22,#0b4f5c,#0e7a8a,#00a8b8,#5ad7ff
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Publishes the SVGs to a branch called "output"
      - name: Push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
